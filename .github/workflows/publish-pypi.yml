name: Publish to PyPI

on:
#   release:
#     types: [published]
#   workflow_dispatch:
    push:
        branches:
        - main
        tags:
        - "v*"

permissions:
  contents: read
  id-token: write
  

jobs:
  validate:
    name: Validate & Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Hatch
        run: pipx install hatch
      - name: Run test suite
        run: hatch test


  build:
    name: Build distributions
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Hatch
        run: pipx install hatch

      - name: Build distributions with Hatch
        run: hatch build

      - name: Verify package metadata
        run: |
          pipx install twine
          twine check dist/*

      - name: Sign distributions with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.3.0
        with:
          inputs: |
            ./dist/*.tar.gz
            ./dist/*.whl
          upload-signing-artifacts: true

      - name: Create GitHub Release
        env:
            GITHUB_TOKEN: ${{ github.token }}
        run: >-
            gh release create        
            '${{ github.ref_name }}'
            --repo '${{ github.repository }}'
            --generate-notes
            --title 'pyOptiGTest ${{ github.ref_name }}'

      - name: Upload artifact signatures to GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # Upload to GitHub Release using the `gh` CLI.
        # `dist/` contains the built packages, and the
        # sigstore-produced signatures and certificates.
        run: >-
          gh release upload
          '${{ github.ref_name }}' dist/** 
          --repo '${{ github.repository }}'

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
          retention-days: 1

  publish:
    name: >-
      Publish Python 🐍 distribution 📦 to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pyOptiGTest/
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1.14
        with:
          verbose: true
