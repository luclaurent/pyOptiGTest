[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyOptiGTest"
dynamic = ["version"]
description = "Python implementation of optimization test functions for benchmarking"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Luc LAURENT", email = "luc.laurent@lecnam.net" },
]
keywords = ["optimization", "test-functions", "benchmarking", "metaheuristics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.22",
]

[project.urls]
Homepage = "https://github.com/luclaurent/pyoptigtest"
Repository = "https://github.com/luclaurent/pyoptigtest"
Issues = "https://github.com/luclaurent/pyoptigtest/issues"

# ---------------------------------------------------------------------------
# Hatch environments
# ---------------------------------------------------------------------------

[tool.hatch.build.targets.sdist]
include = ["pyOptiGTest/**"]

[tool.hatch.build.targets.wheel]
packages = ["pyOptiGTest"]

[tool.hatch.version]
path = "pyOptiGTest/__init__.py"

# --- default env (dev) ---
[tool.hatch.envs.default]
dependencies = [
    "pytest>=7",
    "pytest-cov",
]

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
test-cov = "pytest --cov=pyOptiGTest --cov-report=term-missing {args:tests}"

# --- test matrix ---
[project.optional-dependencies]
test = [
    "scipy",
    "pytest>=7",
    "pytest-cov",
]
[tool.hatch.envs.test]
dependencies = [
    "scipy",
    "pytest>=7",
    "pytest-cov",
]

[[tool.hatch.envs.test.matrix]]
python = ["3.9", "3.10", "3.11", "3.12", "3.13"]

[tool.hatch.envs.test.scripts]
run = "pytest {args:tests}"
cov = "pytest --cov=pyOptiGTest --cov-report=term-missing {args:tests}"

# --- lint env ---
[tool.hatch.envs.lint]
dependencies = [
    "ruff>=0.4",
]

[tool.hatch.envs.lint.scripts]
check = "ruff check pyOptiGTest tests"
format = "ruff format pyOptiGTest tests"

# --- publish env ---
[tool.hatch.envs.publish]
dependencies = [
    "twine>=5",
    "build",
]

[tool.hatch.envs.publish.scripts]
build = "python -m build"
upload = "twine upload dist/*"
upload-test = "twine upload --repository testpypi dist/*"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["-v", "--tb=short"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "genpictures: generate wiki pictures (run with --gen-pictures)",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
source = ["pyOptiGTest"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "if __name__ ==",
    "pragma: no cover",
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
